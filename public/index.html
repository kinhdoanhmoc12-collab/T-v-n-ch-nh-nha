function renderMenu(){menu.innerHTML='<button id="nkt-home">Thư viện tư vấn</button><label>DỊCH VỤ</label>'+services.map((x,i)=>'<button class="service-parent '+(service===x?'active':'')+'" data-service="'+x+'">'+x+'</button>'+(service===x&&(i>=0)?'<div class="submenu">'+(i===0?submenus:i===1?implantMenus:i===2?braceMenus:i===3?tmjMenus:extractionMenus).map(label=>'<button data-section="'+label+'" class="'+(activeSection===label?'active':'')+'" aria-current="'+(activeSection===label?'page':'false')+'">'+label+'</button>'+(label==='Những điều cần biết về Implant'?'<div class="implant-subtopics">'+implantTopicNames.map((n,j)=>'<button data-implant-topic="'+j+'" class="'+(implantTopic===j?'active':'')+'">'+n+'</button>').join('')+'</div>':'')).join('')+'</div>':'')).join('');bind();root.querySelector('#nkt-home').onclick=home;root.querySelectorAll('[data-section]').forEach(b=>b.onclick=()=>openSection(b.dataset.section));root.querySelectorAll('[data-implant-topic]').forEach(b=>b.onclick=()=>implantBasics(Number(b.dataset.implantTopic)))}

function toothShapeCollection(selected=null){

function openSection(label){activeSection=label;renderMenu();if(service===services[1]){implantSection(label);return}if(service===services[2]){braceSection(label);return}if(service===services[3]){tmjSection(label);return}if(service===services[4]){extractionSection(label);return}if(label==='Bộ sưu tập dáng răng')toothShapeCollection();else if(label==='Dòng sứ nổi bật')catalog();else if(label==='Case thực tế'){page=4;show()}else if(label==='Bệnh lý')sanSection(0);else if(label==='Nghệ thuật răng sứ')sanSection(1);else if(label==='Cầu răng sứ')sanSection(3);else if(label==='Smile Design 3D')smileDesign();else if(label==='Phôi sứ & thẻ bảo hành')porcelainOrigin();else sectionDetail(label,label==='Quy trình răng sứ thẩm mỹ'?1:0,()=>openSection(label))}

function tmjSectionOriginal(label){const crumb='<div class="eyebrow">KHỚP THÁI DƯƠNG HÀM</div><h1>'+label+'</h1>';if(label===tmjMenus[0]){const symptoms=['Đau vùng khớp hoặc cơ hàm','Khó há ngậm miệng, khóa hàm','Đau mỏi hàm khi ăn nhai','Tiếng lục cục khi há ngậm miệng','Đau mỏi cổ vai gáy','Thay đổi khớp cắn theo thời gian'];main.innerHTML=crumb+'<div class="detail-grid"><div class="detail-image"><img src="'+serviceImages[3]+'" alt="Minh họa đau vùng hàm"></div><div><h2>Các triệu chứng thường được ghi nhận</h2><ul class="benefits">'+symptoms.map(v=>'<li>'+v+'</li>').join('')+'</ul></div></div>'}else if(label===tmjMenus[1]){main.innerHTML=crumb+'<div class="steps-row">'+['Thăm khám & tư vấn','Thu thập dữ liệu','Lấy tương quan tâm','Lắp máng & mài chỉnh','Mài chỉnh định kỳ'].map((v,i)=>'<section><span>0'+(i+1)+'</span><h2>'+v+'</h2></section>').join('')+'</div><details style="margin-top:24px"><summary>Nội dung quy trình từ tài liệu gốc</summary><p style="line-height:1.8">'+tmjSlides[0].text+'</p></details>'}else if(label===tmjMenus[2]){main.innerHTML=crumb+'<div class="detail-grid"><div class="detail-image"><img src="'+equipment[3].image+'" alt="Giá khớp hỗ trợ thiết kế máng"></div><div><h2>Theo dõi và điều chỉnh cùng bác sĩ</h2><p>Hướng dẫn tháo lắp, làm quen và vệ sinh máng; mài chỉnh máng sơ khởi, sau đó kiểm tra và mài chỉnh định kỳ theo tài liệu.</p></div></div>'}else{const entries=tmjSlides.slice(2).filter(v=>v.text.length>50);main.innerHTML=crumb+'<div class="topic-grid">'+entries.map((v,i)=>'<button class="porcelain-item" data-tmj="'+i+'"><strong>Hồ sơ '+(i+1)+'</strong><span>'+v.text.slice(0,80)+'</span></button>').join('')+'</div>';root.querySelectorAll('[data-tmj]').forEach(b=>b.onclick=()=>{const v=entries[Number(b.dataset.tmj)];main.innerHTML=crumb+'<div class="case-text">'+v.text+'</div>';const back=document.createElement('button');back.className='catalog-back';back.textContent='Quay lại các case';back.onclick=()=>tmjSection(label);main.append(back)})} function extractionSection(label){const crumb='<div class="eyebrow">NHỔ RĂNG KỸ THUẬT CAO</div><h1>'+label+'</h1>';if(label==='Răng khôn là gì?'){main.innerHTML=crumb+'<div class="detail-grid"><div><h2>Răng hàm lớn thứ ba</h2><p>Răng khôn là răng hàm lớn thứ ba, nằm ở phía sau cùng của cung hàm.</p><p>Răng khôn mọc đúng vị trí và khỏe mạnh có thể tham gia ăn nhai. Bác sĩ thăm khám để đánh giá răng có gây vấn đề và có cần nhổ hay không.</p></div><div class="extraction-notes"><h2>Trước khi quyết định nhổ</h2><ul class="benefits"><li>Thăm khám tình trạng răng và nướu.</li><li>Đánh giá vị trí răng và hình ảnh cần thiết.</li><li>Trao đổi lợi ích, rủi ro và phương án phù hợp.</li></ul></div></div><a href="https://www.mouthhealthy.org/all-topics-a-z/wisdom-teeth" target="_blank" rel="noopener">Nguồn: American Dental Association</a>'}else if(label==='Liệu pháp tâm lý'){main.innerHTML=crumb+'<h2>An tâm từ cuộc trò chuyện đầu tiên</h2><div class="steps-row">'+[['Lắng nghe','Khách chia sẻ điều đang lo lắng và trải nghiệm nha khoa trước đây.'],['Giải thích dễ hiểu','Bác sĩ trao đổi từng bước và những cảm giác có thể gặp.'],['Thống nhất tín hiệu dừng','Khách có thể báo khi cần nghỉ hoặc thấy khó chịu.'],['Đồng hành trong suốt buổi nhổ','Nhân viên nhắc nhở nhẹ nhàng, hỗ trợ khách thư giãn.']].map((v,i)=>'<section><span>0'+(i+1)+'</span><h2>'+v[0]+'</h2><p>'+v[1]+'</p></section>').join('')+'</div><div class="preview-note">Đề xuất trải nghiệm chăm sóc khách hàng để phòng khám duyệt; không phải cam kết liệu pháp tâm lý chuyên biệt hay dịch vụ an thần.</div>'}else if(label==='Nhổ răng khôn ứng dụng kỹ thuật số'){main.innerHTML=crumb+'<div class="equipment-detail"><div class="equipment-hero"><img src="'+equipment[0].image+'" alt="Máy Piezotome"><div class="equipment-caption">Máy phẫu thuật siêu âm</div></div><div><h2>Rung siêu âm hỗ trợ thao tác phẫu thuật</h2><p>Piezotome sử dụng đầu dụng cụ rung siêu âm để hỗ trợ nhổ răng và phẫu thuật xương theo chỉ định.</p><h2>Trải nghiệm được chăm sóc nhẹ nhàng</h2><p>Trao đổi trước khi thực hiện, kiểm soát đau theo kế hoạch của bác sĩ và hỗ trợ thư giãn trong suốt quá trình.</p><p class="preview-note">Không mô tả máy là “mát xa lợi” hoặc cam kết không đau; cảm giác và thời gian hồi phục tùy từng ca.</p></div></div><a href="https://www.acteonlearning.com/member/classroom.asp?x_classID=3555" target="_blank" rel="noopener">Tham khảo kỹ thuật Piezotome</a>'}else{main.innerHTML=crumb+'<div class="smile-benefits">'+[['Làm theo hướng dẫn','Dùng thuốc, vệ sinh và chăm sóc vết nhổ theo hướng dẫn riêng của bác sĩ.'],['Theo dõi hồi phục','Trao đổi với phòng khám khi đau hoặc sưng tăng, chảy máu không kiểm soát, sốt hay có dấu hiệu bất thường.'],['Liên hệ khi cần','Giữ thông tin liên hệ phòng khám và lịch hẹn kiểm tra được bác sĩ hướng dẫn.']].map(v=>'<section><h2>'+v[0]+'</h2><p>'+v[1]+'</p></section>').join('')+'</div><a href="https://www.nhs.uk/tests-and-treatments/wisdom-tooth-removal/" target="_blank" rel="noopener">Tham khảo: NHS</a>'}}

function showPhoto(n){photo=(n+v.images.length)%v.images.length;const x=v.images[photo];root.querySelector('#tmj-real-image').src=x.src;root.querySelector('#tmj-real-image').alt=x.alt;root.querySelector('#tmj-real-caption').textContent=x.alt;root.querySelector('#tmj-photo-count').textContent=(photo+1)+' / '+v.images.length;root.querySelectorAll('[data-tmj-photo]').forEach(b=>b.classList.toggle('selected',Number(b.dataset.tmjPhoto)===photo))}

let porcelainMode=0;
catalog=function(mode=porcelainMode){porcelainMode=mode;renderMenu();main.innerHTML='<div class="eyebrow">RĂNG SỨ THẨM MỸ</div><h1>Dòng sứ nổi bật</h1>';implantTabs(['Chụp sứ toàn phần','Veneer sứ toàn phần','So sánh đặc điểm'],mode,n=>catalog(n));if(mode===2){porcelainCompare();return}main.insertAdjacentHTML('beforeend','<div class="porcelain-product-grid">'+porcelainMaterials.map((v,i)=>'<button class="porcelain-product-card" data-material="'+i+'"><div class="porcelain-product-top"><span>'+v.flag+' '+v.origin+'</span><span>'+ (mode===1?'VENEER':'CHỤP SỨ')+'</span></div><h2>'+v.name+'</h2><div class="porcelain-product-media">'+(porcelainImage(i,mode)?'<img src="'+porcelainImage(i,mode)+'" alt="'+(mode===1?'Veneer sứ ':'Chụp sứ toàn phần ')+v.name+'">':'<div class="porcelain-type-mark"><strong>Emax</strong><span>'+ (i===2?'ZIRCONIA':'THỦY TINH · SỨ THỎI')+'</span></div>')+'</div><div class="porcelain-product-price"><span>Chi phí / 1 răng</span><strong>'+ (mode===1?v.veneer:v.crown)+'đ</strong></div><div class="porcelain-product-bottom"><span>Bảo hành '+v.warranty+'</span><span>Xem chi tiết</span></div></button>').join('')+'</div>');root.querySelectorAll('[data-material]').forEach(b=>b.onclick=()=>porcelainProductDetail(Number(b.dataset.material),mode))};
function porcelainCompare(){const fields=[['Độ dày tối thiểu','thickness'],['Độ trong mờ','translucency'],['Độ bền uốn','strength'],['Tính xử lý (mài, dán)','handling'],['Thẩm mỹ tổng thể & độ phổ biến','rating']];main.insertAdjacentHTML('beforeend','<div class="service-price-wrap"><table class="porcelain-compare-table"><thead><tr><th scope="col">Đặc điểm</th>'+porcelainMaterials.map(v=>'<th scope="col">'+v.name+'</th>').join('')+'</tr></thead><tbody>'+fields.map(([label,key])=>'<tr><th scope="row">'+label+'</th>'+porcelainMaterials.map(v=>'<td>'+v[key]+'</td>').join('')+'</tr>').join('')+'</tbody></table></div><p class="porcelain-source-note">Thông số và mức đánh giá theo tư liệu Nha Khoa Trẻ cung cấp.</p>')}
function porcelainProductDetail(i,mode=0){const v=porcelainMaterials[i];page=i;renderMenu();main.innerHTML='<div class="eyebrow">RĂNG SỨ THẨM MỸ / '+(mode===1?'VENEER':'CHỤP SỨ TOÀN PHẦN')+'</div><button class="catalog-back" id="porcelain-products-back">Dòng sứ nổi bật</button><h1>'+v.flag+' '+v.name+'</h1><div class="detail-facts"><div><span>Xuất xứ</span><strong>'+v.origin+'</strong></div><div><span>Bảo hành</span><strong>'+v.warranty+'</strong></div><div class="price-box"><span>Chi phí / 1 răng</span><strong>'+ (mode===1?v.veneer:v.crown)+'đ</strong></div></div>'+ (mode===0&&(i===1||i===2)?'<div class="porcelain-location-prices"><span>Răng hàm: <strong>'+ (i===1?'6.000.000':'8.000.000')+'đ/răng</strong></span><span>Răng cửa / răng nanh: <strong>'+ (i===1?'7.000.000':'9.000.000')+'đ/răng</strong></span></div>':'')+'<div class="porcelain-spec-grid"><section><h2>Đặc điểm</h2><ol class="crown-features">'+v.features.map(x=>'<li>'+x+'</li>').join('')+'</ol></section><section><h2>Thông số theo tư liệu</h2><dl>'+[['Độ dày tối thiểu',v.thickness],['Độ trong mờ',v.translucency],['Độ bền uốn',v.strength],['Xử lý (mài, dán)',v.handling]].map(([label,value])=>'<div><dt>'+label+'</dt><dd>'+value+'</dd></div>').join('')+'</dl></section></div>';
